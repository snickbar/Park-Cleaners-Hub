<!DOCTYPE html>
<html>

<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;
      font-family: Arial, sans-serif;
      background: #f7f9fa;
      color: #111111;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    .header-bar {
      height: 60px;
      background: #ffffff;
      border-bottom: 4px solid #1976d2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      flex-shrink: 0;
    }

    .header-title {
      font-size: 24px;
      font-weight: bold;

    .btn-home {
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      background: #e0e0e0;
      color: #111;
      border: 2px solid #888;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    /* CONTAINER */
    .main-container {
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* SEARCH FILTER PANEL */
    .filter-card {
      background: #ffffff;
      border: 3px solid #1976d2;
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 16px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.05);

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr) auto;
      gap: 12px;
      align-items: end;
    }

    .field-group {
      display: flex;
      flex-direction: column;
    }

    .field-label {
      font-size: 14px;
      font-weight: bold;
      color: #0d47a1;
      margin-bottom: 4px;
    }

    .filter-input, .filter-select {
      height: 42px;
      font-size: 16px;
      padding: 4px 10px;
      border: 2px solid #1976d2;
      border-radius: 6px;
      font-weight: bold;
      background: #fff;
    }

    .btn-clear {
      height: 42px;
      padding: 0 16px;
      font-size: 16px;
      font-weight: bold;
      background: #e0e0e0;
      border: 2px solid #888;
      border-radius: 6px;
      cursor: pointer;
    }

    /* TABLE RESULTS */
    .table-container {
      flex: 1;
      background: #ffffff;
      border: 2px solid #ccc;
      border-radius: 12px;
      overflow-y: auto;
      box-shadow: 0 4px 8px rgba(0,0,0,0.05);
    }

    .invoice-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    .invoice-table th {
      background: #e3f2fd;
      color: #0d47a1;
      padding: 12px 14px;

      top: 0;
      border-bottom: 3px solid #1976d2;

      cursor: pointer;
      user-select: none;
    }

    .invoice-table th:hover {
      background: #bbdefb;
    }

    .invoice-table td {
      padding: 12px 14px;
      border-bottom: 1px solid #e0e0e0;
      font-size: 15px;
      font-weight: 500;
    }

    .invoice-table tr:hover {
      background-color: #f5f5f5;
    }

    .btn-pdf {
      background: #1976d2;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }

    .btn-pdf:hover {
      background: #0d47a1;
    }

    .no-data {
      text-align: center;
      padding: 40px;
      font-size: 18px;
      color: #777;
    }

    /* SELECTION / BULK PRINT TOOLBAR */
    .bulk-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .bulk-count {
      font-size: 16px;
      font-weight: bold;
      color: #0d47a1;
    }

    .btn-bulk {
      height: 42px;
      padding: 0 18px;
      font-size: 16px;
      font-weight: bold;
      background: #1976d2;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-bulk:hover:not(:disabled) {
      background: #0d47a1;
    }

    .btn-bulk:disabled {
      background: #9e9e9e;
      cursor: default;
    }

    .bulk-status {
      font-size: 15px;
      font-weight: bold;
      color: #555;
    }

    .col-select {
      width: 44px;
      text-align: center !important;
    }

    .col-select input {
      width: 20px;
      height: 20px;
      cursor: pointer;
    }

    tr.row-selected td {
      background: #e3f2fd;
    }

    /* ACTION BUTTONS */
    .actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn-status {
      padding: 6px 10px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      border: 2px solid #888;
      background: #fff;
      color: #333;
      white-space: nowrap;
    }

    .btn-status:hover:not(:disabled) {
      background: #f0f0f0;
    }

    .btn-status.done-sent {
      border-color: #ef6c00;
      background: #fff3e0;
      color: #e65100;
    }

    .btn-status.done-paid {
      border-color: #2e7d32;
      background: #e8f5e9;
      color: #1b5e20;
    }

    .btn-status:disabled {
      opacity: 0.6;
      cursor: default;
    }

    /* BULK PRINT RESULT MODAL */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal-card {
      background: #fff;
      border-radius: 12px;
      padding: 28px 32px;
      max-width: 480px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }

    .modal-title {
      font-size: 22px;
      font-weight: bold;
      color: #0d47a1;
      margin-bottom: 10px;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 20px;
    }

    .modal-actions a, .modal-actions button {
      font-size: 17px;
      padding: 10px 20px;
    }
  </style>
  <!-- Merges selected invoice PDFs into one file for bulk printing -->
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>

<body>

  <!-- HEADER BAR -->
  <div class="header-bar">
    <div class="header-title">Park Cleaners - View Past Invoices</div>
    <a class="btn-home" href="<?= baseUrl ?>" target="_top" onclick="return goHome()">🏠 Home</a>
  </div>

  <div class="main-container">

    <!-- SEPARATED SEARCH FILTER BAR -->
    <div class="filter-card">
      <div class="filter-grid">
        <!-- INVOICE # SEARCH -->
        <div class="field-group">
          <label class="field-label">Invoice #</label>
          <input type="text" id="searchNum" class="filter-input" placeholder="e.g. 1080" onkeyup="filterInvoices()">
        </div>

        <!-- CUSTOMER DROPDOWN -->
        <div class="field-group">
          <label class="field-label">Customer</label>
          <select id="searchCustomer" class="filter-select" onchange="filterInvoices()">
            <option value="">-- All Customers --</option>
          </select>
        </div>

        <!-- DATE SEARCH -->
        <div class="field-group">
          <label class="field-label">Date Issued</label>
          <input type="text" id="searchDate" class="filter-input" placeholder="MM/DD/YYYY" onkeyup="filterInvoices()">
        </div>

        <!-- SERVICE / ITEMS SEARCH -->
        <div class="field-group">
          <label class="field-label">Service / Items</label>
          <input type="text" id="searchItems" class="filter-input" placeholder="e.g. Game Jersey" onkeyup="filterInvoices()">
        </div>

        <!-- CLEAR BUTTON -->
        <button class="btn-clear" onclick="clearSearch()">Clear Filters</button>
      </div>
    </div>

    <!-- SELECTION / BULK PRINT -->
    <div class="bulk-bar">
      <span class="bulk-count" id="selectedCount">0 selected</span>
      <button class="btn-bulk" id="btnBulkPrint" onclick="bulkPrint()" disabled>🖨️ Print Selected</button>
      <button class="btn-clear" id="btnClearSelection" onclick="clearSelection()" disabled>Clear Selection</button>
      <span class="bulk-status" id="bulkStatus"></span>
    </div>

    <!-- INVOICE LIST TABLE -->
    <div class="table-container">
      <table class="invoice-table">
        <thead>
          <tr>
            <th class="col-select" style="cursor: default;" title="Select all shown">
              <input type="checkbox" id="selectAll" onclick="toggleSelectAll(this.checked)">
            </th>
            <th onclick="sortTable('invoiceNum')">Invoice # <span id="sort_invoiceNum"></span></th>
            <th onclick="sortTable('date')">Date Issued <span id="sort_date"></span></th>
            <th onclick="sortTable('customer')">Customer <span id="sort_customer"></span></th>
            <th onclick="sortTable('items')">Services / Items <span id="sort_items"></span></th>
            <th onclick="sortTable('total')">Total <span id="sort_total"></span></th>
            <th style="cursor: default;">Action</th>
          </tr>
        </thead>
        <tbody id="invoiceTableBody">
          <tr>
            <td colspan="7" class="no-data">Loading invoice history...</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <!-- BULK PRINT READY -->
  <div class="modal-overlay" id="bulkModal">
    <div class="modal-card">
      <div class="modal-title">Combined PDF Ready</div>
      <p style="font-size: 17px;" id="bulkModalText"></p>
      <p style="font-size: 15px; color: #555;">Open it, then use the print button to print every invoice at once.</p>
      <div class="modal-actions">
        <a class="btn-pdf" id="bulkPdfLink" href="#" target="_blank" onclick="closeBulkModal()">🖨️ Open &amp; Print</a>
        <button class="btn-clear" onclick="closeBulkModal()">Close</button>
      </div>
    </div>
  </div>

  <?!= commonHtml ?>
  <script>
    var rawInvoices = [];
    var displayedInvoices = [];
    var currentSortField = 'date'; // Default: Sort by Date
    var isAscending = false;        // Default: Most recent date first

    // Invoice numbers ticked for bulk printing. Kept across filter changes,
    // so you can search for one customer, tick some, search another, etc.
    var selected = new Set();
    var MAX_BULK = 100;
    var PDFS_PER_REQUEST = 5;
    var isBulkBusy = false;

    var tbody = document.getElementById("invoiceTableBody");
    tbody.addEventListener("click", function(event) {
      const btn = event.target.closest("button[data-status]");
      if (btn) toggleStatus(btn.dataset.num, btn.dataset.status, btn);
    });
    tbody.addEventListener("change", function(event) {
      if (event.target.matches("input[data-select]")) {
        setSelected(event.target.dataset.select, event.target.checked);
        renderTable(displayedInvoices);
      }
    });

    google.script.run
      .withSuccessHandler(onDataLoaded)
      .withFailureHandler(handleError)
      .getInvoiceHistory();

    function onDataLoaded(res) {
      rawInvoices = res.invoices || [];
      populateCustomerDropdown(res.customers || []);

      // Default filter & sort by most recent date first
      filterInvoices();
    }

    function populateCustomerDropdown(customers) {
      const select = document.getElementById("searchCustomer");
      customers.forEach(cust => {
        const opt = document.createElement("option");
        opt.value = cust;
        opt.textContent = cust;
        select.appendChild(opt);
      });
    }

    function findInvoice(invoiceNum) {
      return rawInvoices.find(inv => inv.invoiceNum === invoiceNum);
    }

    function filterInvoices() {
      const numQuery = document.getElementById("searchNum").value.toLowerCase().trim();
      const custQuery = document.getElementById("searchCustomer").value.toLowerCase().trim();
      const dateQuery = document.getElementById("searchDate").value.toLowerCase().trim();
      const itemsQuery = document.getElementById("searchItems").value.toLowerCase().trim();

      displayedInvoices = rawInvoices.filter(item => {
        const matchNum = !numQuery || item.invoiceNum.toLowerCase().includes(numQuery);
        const matchCust = !custQuery || item.customer.toLowerCase() === custQuery;
        const matchDate = !dateQuery || item.date.toLowerCase().includes(dateQuery);
        const matchItems = !itemsQuery || item.items.toLowerCase().includes(itemsQuery);
        return matchNum && matchCust && matchDate && matchItems;
      });

      applySorting();
    }

    function sortTable(field) {
      if (currentSortField === field) {
        isAscending = !isAscending;
      } else {
        currentSortField = field;
        isAscending = (field === 'customer' || field === 'items'); // Text defaults A-Z, Numbers/Dates default Desc
      }
      applySorting();
    }

    function parseDateValue(dateStr) {
      if (!dateStr) return 0;
      // Handle standard MM/DD/YYYY format cleanly
      const parts = dateStr.split('/');
      if (parts.length === 3) {
        const month = parseInt(parts[0], 10) - 1;
        const day = parseInt(parts[1], 10);
        const year = parseInt(parts[2], 10);
        return new Date(year, month, day).getTime();
      }
      const parsed = new Date(dateStr);
      return isNaN(parsed.getTime()) ? 0 : parsed.getTime();
    }

    function applySorting() {
      displayedInvoices.sort((a, b) => {
        let valA = a[currentSortField] || '';
        let valB = b[currentSortField] || '';
        let result = 0;

        // Numeric comparison for Total & Invoice #
        if (currentSortField === 'total' || currentSortField === 'invoiceNum') {
          valA = parseFloat(valA) || 0;
          valB = parseFloat(valB) || 0;
          if (valA < valB) result = -1;
          if (valA > valB) result = 1;
        }
        // Date comparison
        else if (currentSortField === 'date') {
          valA = parseDateValue(valA);
          valB = parseDateValue(valB);
          if (valA < valB) result = -1;
          if (valA > valB) result = 1;

          // Fallback to highest invoice number if dates match
          if (result === 0) {
            const numA = parseFloat(a.invoiceNum) || 0;
            const numB = parseFloat(b.invoiceNum) || 0;
            return isAscending ? (numA - numB) : (numB - numA);
          }
        }
        // String comparison
        else {
          valA = valA.toString().toLowerCase();
          valB = valB.toString().toLowerCase();
          if (valA < valB) result = -1;
          if (valA > valB) result = 1;
        }

        return isAscending ? result : -result;
      });

      updateSortIcons();
      renderTable(displayedInvoices);
    }

    function updateSortIcons() {
      const fields = ['invoiceNum', 'date', 'customer', 'items', 'total'];
      fields.forEach(f => {
        const span = document.getElementById('sort_' + f);
        if (f === currentSortField) {
          span.textContent = isAscending ? '▲' : '▼';
        } else {
          span.textContent = '';
        }
      });
    }

    function statusButton(row, field) {
      const done = !!row[field];
      const labels = {
        sent: done ? `✓ Sent ${row.sent}` : '✉️ Mark as Sent',
        paid: done ? `✓ Paid ${row.paid}` : '💲 Mark as Paid'
      };
      return `<button class="btn-status${done ? ' done-' + field : ''}"
                data-status="${field}" data-num="${escapeHtml(row.invoiceNum)}"
                title="${done ? 'Click to undo' : ''}">${escapeHtml(labels[field])}</button>`;
    }

    function renderTable(records) {
      tbody.innerHTML = "";

      if (records.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="no-data">No matching invoices found.</td></tr>';
        updateSelectionUI();
        return;
      }

      records.forEach(row => {
        const tr = document.createElement("tr");
        const isSelected = selected.has(row.invoiceNum);
        const hasPdf = /^https:\/\//.test(row.pdfUrl);
        if (isSelected) tr.className = "row-selected";

        const pdfBtn = hasPdf
          ? `<a href="${escapeHtml(row.pdfUrl)}" target="_blank" class="btn-pdf">📄 View PDF</a>`
          : `<span style="color:#aaa;">No PDF</span>`;
        const selectBox = hasPdf
          ? `<input type="checkbox" data-select="${escapeHtml(row.invoiceNum)}" ${isSelected ? 'checked' : ''}>`
          : '';

        tr.innerHTML = `
          <td class="col-select">${selectBox}</td>
          <td><strong>#${escapeHtml(row.invoiceNum)}</strong></td>
          <td>${escapeHtml(row.date)}</td>
          <td><strong>${escapeHtml(row.customer)}</strong></td>
          <td>${escapeHtml(row.items)}</td>
          <td><strong>$${(parseFloat(row.total) || 0).toFixed(2)}</strong></td>
          <td><div class="actions">${pdfBtn}${statusButton(row, 'sent')}${statusButton(row, 'paid')}</div></td>
        `;
        tbody.appendChild(tr);
      });

      updateSelectionUI();
    }

    /* ---------- Mark as sent / paid ---------- */

    function toggleStatus(invoiceNum, field, btn) {
      const inv = findInvoice(invoiceNum);
      if (!inv) return;
      const isDone = !!inv[field];
      if (isDone && !confirm(`Undo "${field}" for invoice #${invoiceNum}?`)) return;

      btn.disabled = true;
      btn.textContent = "Saving...";
      google.script.run
        .withSuccessHandler(function(value) {
          inv[field] = value;
          renderTable(displayedInvoices);
        })
        .withFailureHandler(function(err) {
          alert("Couldn't update invoice #" + invoiceNum + ": " + err.message);
          renderTable(displayedInvoices);
        })
        .setInvoiceStatus(invoiceNum, field, !isDone);
    }

    /* ---------- Selection ---------- */

    function setSelected(invoiceNum, isOn) {
      if (isOn) {
        if (selected.size >= MAX_BULK) {
          alert(`You can bulk print up to ${MAX_BULK} invoices at a time.`);
          return false;
        }
        selected.add(invoiceNum);
      } else {
        selected.delete(invoiceNum);
      }
      return true;
    }

    function printableShown() {
      return displayedInvoices.filter(inv => /^https:\/\//.test(inv.pdfUrl));
    }

    function toggleSelectAll(isOn) {
      for (const inv of printableShown()) {
        if (!setSelected(inv.invoiceNum, isOn)) break;
      }
      renderTable(displayedInvoices);
    }

    function clearSelection() {
      selected.clear();
      renderTable(displayedInvoices);
    }

    function updateSelectionUI() {
      const shown = printableShown();
      const shownSelected = shown.filter(inv => selected.has(inv.invoiceNum)).length;
      const hidden = selected.size - shownSelected;

      document.getElementById("selectedCount").textContent =
        `${selected.size} selected` + (hidden > 0 ? ` (${hidden} hidden by filters)` : '');
      document.getElementById("btnBulkPrint").disabled = selected.size === 0 || isBulkBusy;
      document.getElementById("btnClearSelection").disabled = selected.size === 0 || isBulkBusy;

      const selectAll = document.getElementById("selectAll");
      selectAll.checked = shown.length > 0 && shownSelected === shown.length;
      selectAll.indeterminate = shownSelected > 0 && shownSelected < shown.length;
    }

    /* ---------- Bulk print ----------
       Fetches each selected invoice's PDF, merges them into one PDF in the
       browser (pdf-lib), saves that to Drive, and opens it so the whole
       batch prints with a single print command. */


    function runServer(fnName, ...args) {
      return new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)[fnName](...args);
      });
    }

    function base64ToBytes(b64) {
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return bytes;
    }

    function bytesToBase64(bytes) {
      let bin = "";
      const CHUNK = 0x8000;
      for (let i = 0; i < bytes.length; i += CHUNK) {
        bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
      }
      return btoa(bin);
    }

    function setBulkStatus(text) {
      document.getElementById("bulkStatus").textContent = text;
    }

    async function bulkPrint() {
      if (selected.size === 0 || isBulkBusy) return;
      if (!window.PDFLib) {
        alert("The PDF tool didn't load. Check your internet connection and reload the page.");
        return;
      }

      // Print in the order shown on screen; selected-but-filtered-out
      // invoices go last, by invoice number.
      const order = new Map(displayedInvoices.map((inv, i) => [inv.invoiceNum, i]));
      const nums = Array.from(selected).sort((a, b) => {
        const ia = order.has(a) ? order.get(a) : Infinity;
        const ib = order.has(b) ? order.get(b) : Infinity;
        return ia !== ib ? ia - ib : (parseFloat(a) || 0) - (parseFloat(b) || 0);
      });

      isBulkBusy = true;
      updateSelectionUI();
      try {
        const merged = await PDFLib.PDFDocument.create();
        for (let i = 0; i < nums.length; i += PDFS_PER_REQUEST) {
          const batch = nums.slice(i, i + PDFS_PER_REQUEST);
          setBulkStatus(`Loading invoices ${i + 1}-${i + batch.length} of ${nums.length}...`);
          const pdfs = await runServer("getInvoicePdfs", batch);
          for (const pdf of pdfs) {
            const doc = await PDFLib.PDFDocument.load(base64ToBytes(pdf.data));
            const pages = await merged.copyPages(doc, doc.getPageIndices());
            pages.forEach(page => merged.addPage(page));
          }
        }

        setBulkStatus("Combining...");
        const mergedBytes = await merged.save();

        setBulkStatus("Saving combined PDF...");
        const url = await runServer("saveBulkPrintPdf", bytesToBase64(mergedBytes), nums.length);

        document.getElementById("bulkModalText").textContent =
          `${nums.length} invoice${nums.length === 1 ? '' : 's'} combined into one PDF.`;
        document.getElementById("bulkPdfLink").href = url;
        document.getElementById("bulkModal").style.display = "flex";
      } catch (err) {
        alert("Bulk print failed: " + (err && err.message ? err.message : err));
      } finally {
        isBulkBusy = false;
        setBulkStatus("");
        updateSelectionUI();
      }
    }

    function closeBulkModal() {
      document.getElementById("bulkModal").style.display = "none";
    }

    function clearSearch() {
      document.getElementById("searchNum").value = "";
      document.getElementById("searchCustomer").value = "";
      document.getElementById("searchDate").value = "";
      document.getElementById("searchItems").value = "";
      filterInvoices();
    }

    function handleError(err) {
      tbody.innerHTML =
        `<tr><td colspan="7" class="no-data" style="color:red;">Error loading history: ${escapeHtml(err.message)}</td></tr>`;
    }
  </script>
</body>
